[package]
name = "media-browser"
version = "0.9.0"
authors = ["Alexander Schwarzkopf <progs@fangornsrealm.eu>"]
edition = "2024"
description = "Browse and play your media files, view your images, tag them and search for metadata."
readme = "README.md"
license = "GPL-3.0"
homepage = "https://github.com/fangornsrealm/media-browser"
repository = "https://github.com/fangornsrealm/media-browser.git"
rust-version = "1.93"

[lints.rust]
# No additional rustc lints beyond the defaults.

[lints.clippy]
# Track the remaining ~200 unwrap/expect crash paths (SUGGESTIONS.md 4.1).
# Kept as warnings (not deny) so existing call-sites don't break CI while we
# migrate them to proper error handling. New code should avoid adding more.
unwrap_used = "warn"
expect_used = "warn"

[build-dependencies]
vergen = { version = "8", features = ["git", "gitcl"] }

[dependencies]
audiotags = "0.5"
bytes = "1.9.0"
bytemuck = "1.0"
chrono = { version = "0.4", features = ["unstable-locales"] }
dirs = "6.0.0"
env_logger = "0.11"
file-format = { version = "0.26.0", features = ["reader"] }
freedesktop_entry_parser = "1.3"
fs_extra = { git = "https://github.com/pop-os/fs_extra.git", rev = "7e7222e" }
gio = { version = "0.20.6", optional = true }
glib = { version = "0.20.6", optional = true }
glob = "0.3"
html-escape = "0.2.13"
icu_collator = "1.5"
icu_provider = { version = "1.5", features = ["sync"] }
ignore = "0.4"
image = "0.25.5"
serde_json = "1"
imagesize = "0.13.0"
lazy_static = "1"
libc = "0.2"
log = "0.4"
mime_guess = "2"
nom-exif = "2.3.0"
notify-debouncer-full = "0.3"
notify-rust = { version = "4", optional = true }
once_cell = "1.20.2"
open = "5.3.2"
paste = "1.0"
rayon = "1"
regex = "1"
rusqlite = { version = "0.33.0", features = ["bundled", "chrono"] }
rustc-hash = "2.1.0"
serde = { version = "1", features = ["serde_derive"] }
shlex = { version = "1.3" }
thiserror = "2.0.11"
tikv-jemallocator = { version = "0.6", optional = true }
tokio = { version = "1", features = ["sync", "time"] }
trash = { git = "https://github.com/jackpot51/trash-rs.git", rev = "483f839" }
url = "2"
walkdir = "2.5.0"
wayland-client = { version = "0.31.7", optional = true }
xdg = { version = "2.5.2", optional = true }
xdg-mime = "0.4"
xml = "0.8.16"
zbus = { version = "5", default-features = false, features = [
    "tokio",
] } # was "= 4.4.0" — libcosmic 1.0 pulls zbus 5.x (registry: 5.3.0–5.19.0)

# Compression
bzip2 = { version = "0.5", optional = true }   #TODO: replace with pure Rust crate
flate2 = "1.0"
liblzma = { version = "0.3", optional = true } #TODO: replace with pure Rust crate
tar = "0.4.43"
# Internationalization
i18n-embed = { version = "0.15", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.9"
rust-embed = "8"
slotmap = "1.0.7"
recently-used-xbel = "1.1.0"
zip = "2.1.6"
unix_permissions_ext = "0.1.2"
uzers = "0.12.0"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "6af8b70"                                               # libcosmic 1.0.0 — edition 2024, rust-version 1.93, iced 0.14.0 stable, wgpu 28.0.0 (see docs/PLAN, Appendix B Q1)
default-features = false
features = ["a11y", "multi-window", "tokio", "winit", "wgpu"]

# libcosmic 1.0 does not re-export `iced_wgpu` (the `Primitive` /
# `Pipeline` / `Storage` / `Renderer` modules). We depend on it directly;
# cargo resolves it to the same crate in the libcosmic git workspace
# (`path = "iced/wgpu"`) so there is exactly one copy.
[dependencies.iced_wgpu]
git = "https://github.com/pop-os/libcosmic.git"
rev = "6af8b70"
package = "iced_wgpu"

#[dependencies.iced_video_player]
#git = "https://github.com/jackpot51/iced_video_player.git"
#branch = "prev-cosmic"
#default-features = false

[dependencies.accesskit_unix]
version = "0.17"         # was "= 0.13.1" — iced 0.14.0 / libcosmic 1.0 use accesskit 0.17.x (registry: 0.17.2)
default-features = false
features = ["tokio"]

[dependencies.smol_str]
version = "0.3.2"
features = ["serde"]

[features]
default = [
    "advanced",
    "bzip2",
    "desktop",
    "liblzma",
    "notify",
    "winit",
    "wgpu",
    "gvfs",
]
advanced = []
desktop = ["libcosmic/desktop", "dep:xdg"]
jemalloc = ["dep:tikv-jemallocator"]
notify = ["dep:notify-rust"]
wayland = ["libcosmic/wayland", "dep:wayland-client"]
winit = ["libcosmic/winit"]
wgpu = ["libcosmic/wgpu"]
glib = ["dep:glib"]
gvfs = ["dep:gio", "dep:glib"]

[profile.dev]
opt-level = 1

[profile.release-with-debug]
inherits = "release"
debug = true

[target.'cfg(unix)'.dependencies]
fork = "0.1"

[dev-dependencies]
# cap-std = "3"
# cap-tempfile = "3"
fastrand = "2"
tempfile = "3"
test-log = "0.2"
tokio = { version = "1", features = ["rt", "macros"] }

[patch.crates-io]
# https://github.com/alexcrichton/filetime/pull/104
filetime = { git = "https://github.com/jackpot51/filetime", rev = "186e19d" }

# Vendored copy of window_clipboard 0.4.1 (from the pop-os fork used by
# iced 0.14.0) with the Windows-only `clipboard-win` requirement relaxed from
# the yanked `5.4.0` to `^5.0` so the tree resolves offline on non-Windows
# platforms.
[patch.'https://github.com/pop-os/window_clipboard.git']
window_clipboard = { path = "vendor/window_clipboard" }
dnd = { path = "vendor/window_clipboard/dnd" }
mime = { path = "vendor/window_clipboard/mime" }

# [patch.'https://github.com/pop-os/cosmic-text']
# cosmic-text = { path = "../cosmic-text" }

# [patch.'https://github.com/pop-os/fs_extra']
# fs_extra = { path = "../fs_extra" }

# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

# [patch.'https://github.com/pop-os/smithay-clipboard']
# smithay-clipboard = { path = "../smithay-clipboard" }

[package.metadata.deb]
license-file = "LICENSE"
assets = [
    [
        "target/release/media-browser",
        "usr/bin/",
        "755",
    ],
    [
        "res/eu.fangornsrealm.MediaBrowser.desktop",
        "usr/share/applications/",
        "644",
    ],
    [
        "res/eu.fangornsrealm.MediaBrowser.metainfo.xml",
        "usr/share/metainfo/",
        "644",
    ],
    [
        "res/eu.fangornsrealm.MediaBrowser.svg",
        "usr/share/icons/hicolor/scalable/apps/",
        "644",
    ],
]
depends = [
    "libc6",
    "libxkbcommon0",
    "libmpv2",
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/media-browser", dest = "/usr/bin/", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/doc/eu.fangornsrealm.MediaBrowser/LICENSE", doc = true, mode = "644" },
    { source = "res/eu.fangornsrealm.MediaBrowser.desktop", dest = "/usr/share/applications/", mode = "644" },
    { source = "res/eu.fangornsrealm.MediaBrowser.svg", dest = "/usr/share/icons/scalable/apps/", mode = "644" },
]

[package.metadata.generate-rpm.requires]
glibc = "*"
libxkbcommon = "*"
mpv-libs = "*"
