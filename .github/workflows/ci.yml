name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting (informational)
        # The tree currently carries ~161 pre-existing formatting diffs
        # spread across ~35 source files. Keep the step visible but
        # non-blocking until a dedicated `cargo fmt` pass is landed;
        # track in SUGGESTIONS.md, then flip `continue-on-error` off once
        # the tree is clean.
        continue-on-error: true
        run: cargo fmt --all --check

  clippy-test:
    name: Clippy & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        # GStreamer + glib are required by the gstreamer/gio/glib crates,
        # bzip2 + lzma by the compression features, xkbcommon/wayland by
        # the libcosmic/winput UI stack.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            gstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            libglib2.0-dev \
            libbzip2-dev \
            liblzma-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy (informational)
        # The tree currently carries 10 pre-existing clippy errors
        # (mostly `never_loop` in app.rs/tab.rs). Keep the step visible but
        # non-blocking until they are cleaned up; track in SUGGESTIONS.md
        # (4.1 / 6.4), then flip `continue-on-error` off.
        continue-on-error: true
        run: cargo clippy --lib

      - name: Tests
        run: cargo test --lib
