name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        # Hard gate: the tree is kept `cargo fmt`-clean; a dedicated
        # `cargo fmt` pass was landed before enabling this (see
        # SUGGESTIONS.md 6.4).
        run: cargo fmt --all --check

  clippy-test:
    name: Clippy & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        # libmpv is required by the media player (mpv FFI),
        # bzip2 + lzma by the compression features, xkbcommon/wayland by
        # the libcosmic/winput UI stack. ffmpeg is used by the playback
        # unit tests (they skip themselves when it is missing).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libmpv-dev \
            libglib2.0-dev \
            libbzip2-dev \
            liblzma-dev \
            libxkbcommon-dev \
            libwayland-dev \
            ffmpeg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        # Hard gate: the 10 pre-existing clippy errors (8x `never_loop` in
        # app.rs, 1 `arithmetic_side_effects` in parsers.rs, 1
        # `derived_hash_with_manual_eq` in sql.rs) were fixed before
        # enabling this (see SUGGESTIONS.md 6.4).
        run: cargo clippy --lib

      - name: Tests
        run: cargo test --lib
